submission:
  title: "Threat Intelligence System"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Organizations face a growing number of cybersecurity threats from malicious IPs,
    domains, URLs, phishing campaigns, malware indicators, and other sources of
    threat intelligence. Security teams need a centralized way to analyze, correlate,
    prioritize, and respond to these threats quickly.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    Threat Intelligence System is an AI-powered security platform that collects and
    analyzes threat indicators, identifies potentially malicious activity, prioritizes
    threats based on risk, and provides actionable recommendations to security teams.
    It provides a centralized dashboard for monitoring threats and supporting faster
    security decision-making.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "AI-powered threat analysis and risk prioritization"
    - "Threat indicator detection and correlation"
    - "Centralized cybersecurity monitoring dashboard"
    - "Threat severity scoring and explainable recommendations"
    - "Security incident investigation and response guidance"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    
    
                                   # optional 4th
                                   # optional 5th

  tech_stack:
    languages: 
      - "Python"
      - "JavaScript"
      - "TypeScript"                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: 
      - "FastAPI"
      - "React"                     # e.g., ["FastAPI", "React"]
    ibm_technologies: 
      - "IBM Bob"               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases:
      - "SQLite"                      # e.g., ["PostgreSQL", "Redis"]
    other: 
      - "Git"
      - "Docker"
      - "REST API"                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    We are most proud of building an integrated threat intelligence workflow that
    combines threat detection, risk prioritization, explainable analysis, and
    actionable security recommendations in a single platform.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The system currently relies on available threat intelligence feeds and
    simulated data for demonstration purposes. Production deployment would require
    additional real-time feeds, enterprise integrations, and continuous model
    evaluation.

